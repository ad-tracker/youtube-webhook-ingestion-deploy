## Version 2024/11/15
# Rate limiting configuration for YouTube Webhook Ingestion Service
# This file should be loaded before other site configurations

# Define rate limiting zones
# These must be defined at the http level, not in server blocks

# Webhook endpoint: 10 requests per second per IP
limit_req_zone $binary_remote_addr zone=webhook_limit:10m rate=10r/s;

# API endpoint: 5 requests per second per IP
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=5r/s;

# Connection limits
limit_conn_zone $binary_remote_addr zone=conn_limit:10m;
