## Version 2024/11/15
# YouTube Webhook Ingestion Service Configuration

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;

    server_name yt.justinnewman.tech;

    include /config/nginx/ssl.conf;

    client_max_body_size 10M;

    # Enable real IP forwarding
    real_ip_header X-Forwarded-For;
    set_real_ip_from 172.16.0.0/12;
    real_ip_recursive on;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;

    # Health check endpoint - no rate limiting
    location /health {
        access_log off;
        proxy_pass http://webhook-service:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Health check timeout settings
        proxy_connect_timeout 5s;
        proxy_send_timeout 5s;
        proxy_read_timeout 5s;
    }

    # Webhook endpoint - public facing, needs some rate limiting
    location /webhook {
        # Rate limiting to prevent abuse
        limit_req zone=webhook_limit burst=20 nodelay;
        limit_req_status 429;

        # Proxy to webhook service
        proxy_pass http://webhook-service:8080;
        proxy_http_version 1.1;

        # Headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        # Preserve original request headers for signature verification
        proxy_pass_request_headers on;

        # Timeouts
        proxy_connect_timeout 30s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;

        # Logging
        access_log /config/log/nginx/webhook-access.log;
        error_log /config/log/nginx/webhook-error.log;
    }

    # API endpoints - protected with API key authentication
    location /api/ {
        # Stricter rate limiting for API
        limit_req zone=api_limit burst=10 nodelay;
        limit_req_status 429;

        # Proxy to webhook service
        proxy_pass http://webhook-service:8080;
        proxy_http_version 1.1;

        # Headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        # Preserve API key header
        proxy_pass_request_headers on;

        # Timeouts
        proxy_connect_timeout 30s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;

        # Logging
        access_log /config/log/nginx/api-access.log;
        error_log /config/log/nginx/api-error.log;
    }

    # Deny access to all other locations
    location / {
        return 404;
    }
}

# HTTP to HTTPS redirect
server {
    listen 80;
    listen [::]:80;

    server_name _;

    # Allow Let's Encrypt ACME challenge
    location /.well-known/acme-challenge/ {
        root /config/www;
    }

    # Redirect all other HTTP traffic to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}
